<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>gitboard</title>
  <style>
    :root {
      --bg: #f6f7f9; --panel: #ffffff; --line: #e4e7ec; --text: #1a1d21; --text2: #667085;
      --accent: #2f6feb; --accent-soft: #e8f0fe;
      --clean: #12a150; --clean-soft: #e6f6ee;
      --dirty: #d97706; --dirty-soft: #fdf1e0;
      --staged: #12a150; --modified: #d97706; --untracked: #667085;
      --ahead: #2f6feb; --behind: #d64545;
      --wt-bg: #edf0f7; --wt-line: #d5dcea;
      --radius: 12px; --shadow: 0 1px 2px rgba(16,24,40,.06), 0 1px 3px rgba(16,24,40,.1);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0e1116; --panel: #161b22; --line: #262c36; --text: #e6edf3; --text2: #8b949e;
        --accent: #4d8bff; --accent-soft: #17233b;
        --clean: #3fb950; --clean-soft: #12261a;
        --dirty: #e3a008; --dirty-soft: #2a2110;
        --staged: #3fb950; --modified: #e3a008; --untracked: #8b949e;
        --ahead: #4d8bff; --behind: #f47272;
        --wt-bg: #121824; --wt-line: #232c3d;
        --shadow: 0 1px 2px rgba(0,0,0,.4);
      }
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text);
      font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    header { position: sticky; top: 0; z-index: 5; background: var(--bg);
      border-bottom: 1px solid var(--line); padding: 16px 24px; }
    .top { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
    h1 { font-size: 1.25rem; margin: 0; letter-spacing: -.02em; }
    h1 .dot { color: var(--accent); }
    .roots { color: var(--text2); font-size: .8rem; }
    .controls { display: flex; align-items: center; gap: 10px; margin-top: 12px; flex-wrap: wrap; }
    input[type=search] { flex: 1 1 220px; min-width: 160px; padding: 7px 11px; border: 1px solid var(--line);
      border-radius: 8px; background: var(--panel); color: var(--text); font-size: .85rem; }
    button, label.toggle { border: 1px solid var(--line); background: var(--panel); color: var(--text);
      padding: 7px 12px; border-radius: 8px; font-size: .82rem; cursor: pointer; white-space: nowrap; }
    button:hover { border-color: var(--accent); }
    label.toggle { display: inline-flex; align-items: center; gap: 6px; user-select: none; }
    .meta { color: var(--text2); font-size: .78rem; margin-left: auto; }
    main { padding: 20px 24px 60px; }
    .groups { display: flex; flex-direction: column; gap: 24px; }
    .grid { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); }

    /* One section per scanned root, separated by a titled rule. A root that holds only
       linked worktrees also gets a tinted panel, so it reads as derived, not primary. */
    .group-head { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
    .group-title { font-size: .74rem; font-weight: 750; letter-spacing: .07em; text-transform: uppercase;
      color: var(--text2); white-space: nowrap; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    .group-title .icon { color: var(--accent); margin-right: 5px; }
    .group-head .rule { flex: 1; height: 1px; background: var(--line); }
    .group-count { font-size: .74rem; color: var(--text2); white-space: nowrap; }
    .group.worktrees { background: var(--wt-bg); border: 1px solid var(--wt-line);
      border-radius: 14px; padding: 14px 16px 18px; }
    .group.worktrees .rule { background: var(--wt-line); }

    /* Card chip: "⧉ alice" = this IS a worktree of alice; "⧉ 2" = this HAS 2 worktrees. */
    .wt { font-size: .7rem; font-weight: 700; color: var(--accent); background: var(--accent-soft);
      padding: 2px 8px; border-radius: 999px; white-space: nowrap; }
    .wt.ghost { color: var(--text2); background: transparent; border: 1px dashed var(--line); font-weight: 600; }
    .card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
      box-shadow: var(--shadow); overflow: hidden; }
    .card.dirty { border-left: 3px solid var(--dirty); }
    .card.clean { border-left: 3px solid var(--clean); }
    .card-head { padding: 14px 16px; cursor: pointer; }
    .name-row { display: flex; align-items: center; gap: 8px; }
    .name { font-weight: 650; font-size: .98rem; }
    .parent { color: var(--text2); font-size: .74rem; }
    .badge { margin-left: auto; font-size: .7rem; font-weight: 700; padding: 2px 9px; border-radius: 999px; }
    .badge.dirty { color: var(--dirty); background: var(--dirty-soft); }
    .badge.clean { color: var(--clean); background: var(--clean-soft); }
    .row2 { display: flex; align-items: center; gap: 10px; margin-top: 9px; flex-wrap: wrap; }
    .branch { display: inline-flex; align-items: center; gap: 5px; font-size: .8rem; font-weight: 600;
      color: var(--accent); background: var(--accent-soft); padding: 2px 9px; border-radius: 999px; }
    .detached { color: var(--dirty); background: var(--dirty-soft); }
    .track { font-size: .78rem; color: var(--text2); }
    .track .ahead { color: var(--ahead); font-weight: 700; }
    .track .behind { color: var(--behind); font-weight: 700; }
    .counts { display: flex; gap: 8px; font-size: .76rem; }
    .counts span { font-weight: 700; }
    .counts .s { color: var(--staged); } .counts .m { color: var(--modified); } .counts .u { color: var(--untracked); }
    .last { margin-top: 10px; color: var(--text2); font-size: .78rem; display: flex; gap: 6px; }
    .last .h { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--text); }
    .last .subj { color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .detail { border-top: 1px solid var(--line); padding: 14px 16px; background: var(--bg); font-size: .82rem; }
    .detail h4 { margin: 0 0 6px; font-size: .72rem; text-transform: uppercase; letter-spacing: .05em; color: var(--text2); }
    .detail section { margin-bottom: 14px; }
    .files { list-style: none; margin: 0; padding: 0; }
    .files li { display: flex; gap: 8px; padding: 2px 0; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: .78rem; }
    .files .code { width: 22px; color: var(--text2); }
    .files.staged .code { color: var(--staged); } .files.modified .code { color: var(--modified); } .files.untracked .code { color: var(--untracked); }
    .branches { display: flex; flex-wrap: wrap; gap: 6px; }
    .branches .b { border: 1px solid var(--line); border-radius: 999px; padding: 2px 9px; font-size: .76rem; }
    .branches .b.current { border-color: var(--accent); color: var(--accent); font-weight: 700; }
    .commits { list-style: none; margin: 0; padding: 0; }
    .commits li { display: flex; gap: 8px; padding: 2px 0; color: var(--text2); }
    .commits .h { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--text); }
    .commits .subj { color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; }
    .empty { color: var(--text2); padding: 40px; text-align: center; }
    .spin { color: var(--text2); font-size: .78rem; }
  </style>
</head>
<body>
  <header>
    <div class="top">
      <h1>git<span class="dot">board</span></h1>
      <span class="roots" id="roots"></span>
    </div>
    <div class="controls">
      <input type="search" id="q" placeholder="Filter repos by name…" autocomplete="off" />
      <label class="toggle"><input type="checkbox" id="dirtyOnly" /> Dirty only</label>
      <label class="toggle"><input type="checkbox" id="auto" checked /> Auto-refresh</label>
      <button id="refresh">Refresh</button>
      <span class="meta" id="meta"></span>
    </div>
  </header>
  <main>
    <div class="groups" id="grid"></div>
    <div class="empty" id="empty" hidden></div>
  </main>
  <script src="/app.js"></script>
</body>
</html>
